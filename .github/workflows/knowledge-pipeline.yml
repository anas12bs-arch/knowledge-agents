name: 🧠 Knowledge Pipeline — 24/7

# ══════════════════════════════════════════════════════════════════
#  ARQUITECTURA:
#    1. Cada 4h los 4 agentes corren EN PARALELO (4 jobs)
#    2. Cada uno escribe .md al corpus/ del repo
#    3. El job "build-graph" espera a todos y ejecuta:
#         graphify ./corpus --incremental
#    4. El resultado (graphify-out/ + corpus/) se commitea al repo
#    5. Tu Mac hace `git pull` cuando enciende → grafo actualizado
#
#  REPO PÚBLICO = minutos ILIMITADOS en GitHub Actions (gratis)
#  NO NECESITA:  Supabase · API keys · embeddings externos
# ══════════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: "0 */4 * * *"   # cada 4 horas
  workflow_dispatch:         # también puedes lanzarlo manualmente
    inputs:
      agents:
        description: "Agents to run (news github skills social — separados por espacio)"
        default: "news github skills social"
        required: false

jobs:

  # ── Job 1 — News ────────────────────────────────────────────────
  news:
    name: 📰 News (HN + Dev.to + RSS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -q httpx
      - run: python agents/agent_news.py
        env:
          CORPUS_DIR: ${{ github.workspace }}/corpus

      - name: Debug - Check if files were created
        run: |
          echo "CORPUS_DIR env: $CORPUS_DIR"
          echo "Workspace: ${{ github.workspace }}"
          echo "Contents of corpus/:"
          find corpus/ -type f 2>/dev/null | head -10 || echo "  (empty)"

      - uses: actions/upload-artifact@v4
        with:
          name: corpus-news
          path: corpus/
          retention-days: 1

  # ── Job 2 — GitHub ──────────────────────────────────────────────
  github-intel:
    name: 🐙 GitHub (trending + releases + hiring)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -q httpx
      - run: python agents/agent_github.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CORPUS_DIR:   ${{ github.workspace }}/corpus
      - run: find corpus/ -type f 2>/dev/null | head -5 || echo "corpus/ empty"

      - uses: actions/upload-artifact@v4
        with:
          name: corpus-github
          path: corpus/
          retention-days: 1

  # ── Job 3 — Skills ──────────────────────────────────────────────
  skills:
    name: 🎓 Skills (roadmap + npm + PyPI + arxiv)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -q httpx
      - run: python agents/agent_skills.py
        env:
          CORPUS_DIR: ${{ github.workspace }}/corpus

      - uses: actions/upload-artifact@v4
        with:
          name: corpus-skills
          path: corpus/
          retention-days: 1

  # ── Job 4 — Social ──────────────────────────────────────────────
  social:
    name: 📱 Social (X/Twitter + YouTube + Reddit + Podcasts)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -q httpx
      - run: python agents/agent_social.py
        env:
          CORPUS_DIR: ${{ github.workspace }}/corpus

      - uses: actions/upload-artifact@v4
        with:
          name: corpus-social
          path: corpus/
          retention-days: 1

  # ── Build graph — espera a los 4 ────────────────────────────────
  build-graph:
    name: 🔨 Build Knowledge Graph (graphify)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [news, github-intel, skills, social]
    if: always()   # corre aunque algún agente falle
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # necesitamos historial para commit
          token: ${{ secrets.GITHUB_TOKEN }}

      # Descargar todos los corpus de los 4 jobs paralelos (a subcarpetas separadas)
      - uses: actions/download-artifact@v4
      - name: Merge corpus subdirs
        run: |
          mkdir -p corpus
          for dir in corpus-news corpus-github corpus-skills corpus-social; do
            [ -d "$dir" ] && find "$dir" -name "*.md" -exec cp {} corpus/ \;
          done
          echo "📁 Merged corpus contents:"
          find corpus -name "*.md" | wc -l | xargs echo "  Total files:"

      # Instalar graphify (el mismo paquete que usas local)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install graphify
        run: pip install -q graphifyy httpx

      # Contar archivos nuevos
      - name: Corpus stats
        run: |
          echo "📁 Corpus content:"
          find corpus/ -name "*.md" | wc -l | xargs echo "  Total markdown files:"
          for dir in corpus/*/; do
            count=$(find "$dir" -name "*.md" 2>/dev/null | wc -l)
            echo "  $(basename $dir): $count files"
          done

      # Construir/actualizar el knowledge graph (AST-only, sin LLM ni API key)
      - name: Build knowledge graph
        run: |
          graphify update . --no-cluster

      # Mostrar el reporte generado
      - name: Show graph report
        run: |
          if [ -f graphify-out/GRAPH_REPORT.md ]; then
            echo "=== GRAPH REPORT ==="
            head -60 graphify-out/GRAPH_REPORT.md
          fi

      # Commitear corpus + graphify-out de vuelta al repo
      - name: Commit & push updated graph
        run: |
          git config user.name  "Knowledge Bot 🤖"
          git config user.email "bot@knowledge-pipeline.ai"
          git add corpus/ graphify-out/
          # Solo commitear si hay cambios reales
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            NEW_FILES=$(git diff --staged --name-only | wc -l)
            TS=$(date -u '+%Y-%m-%d %H:%M UTC')
            git commit -m "🧠 Knowledge update: +${NEW_FILES} files | run ${{ github.run_number }} | ${TS} [skip ci]"
            git push
          fi

  # ── Summary ─────────────────────────────────────────────────────
  summary:
    name: 📊 Pipeline Summary
    runs-on: ubuntu-latest
    needs: build-graph
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Print total knowledge
        run: |
          echo "========================================"
          echo " 🧠 KNOWLEDGE PIPELINE SUMMARY"
          echo "========================================"
          TOTAL=$(find corpus/ -name "*.md" 2>/dev/null | wc -l || echo 0)
          echo " Total corpus files : $TOTAL"
          echo " Graph output dir   : $(ls graphify-out/ 2>/dev/null || echo 'not yet built')"
          echo " Run number         : ${{ github.run_number }}"
          echo " Triggered by       : ${{ github.event_name }}"
          echo "========================================"
