name: "\U0001F9E0 Knowledge Pipeline — 24/7"

# ══════════════════════════════════════════════════════════════════
#  MULTINATIONAL INTELLIGENCE PIPELINE
#  15 agentes × cada 3 min = ~10,000+ docs/día
#
#  DEPARTAMENTOS:
#    Tech Core:   News, GitHub, Skills, Social
#    Design:      UX, UI, CSS, Design Patterns
#    Product:     Startups, Product Hunt, YC, Indie Hackers
#    Engineering: System Design, Architecture, Scalability
#    DevOps:      K8s, Docker, CI/CD, Infrastructure
#    AI/ML:       ArXiv papers, OpenAI, HuggingFace, Anthropic
#    Security:    CVEs, Cybersecurity, Privacy
#    Sales:       HubSpot, Gong, SaaStr, Sales Tactics
#    Business:    HBR, a16z, VC Strategy, Paul Graham
#    Psychology:  Behavioral Science, Decision Making, Cognition
#    Legal:       Privacy law, Compliance, EFF, Tech Policy
#    Finance:     Funding, Fintech, Tax, IRS
# ══════════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: "*/5 * * * *"   # cada 5 minutos = mínimo GitHub Actions = 288 runs/día
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: knowledge-pipeline
  cancel-in-progress: true

jobs:
  harvest-and-build:
    name: "\U0001F680 15-Agent Harvest + Build Graph"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -q httpx graphifyy

      # ── 15 agentes en paralelo (ThreadPoolExecutor) ─────────────
      - name: "\U0001F680 Run all 15 agents in parallel"
        run: python agents/run_all.py
        env:
          CORPUS_DIR: ${{ github.workspace }}/corpus
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Construir knowledge graph ──────────────────────────────
      - name: "\U0001F528 Build knowledge graph (graphify)"
        run: |
          TOTAL=$(find corpus/ -name "*.md" 2>/dev/null | wc -l)
          if [ "$TOTAL" -gt 0 ]; then
            graphify update . --no-cluster
            echo "✅ Graph built from $TOTAL corpus files"
          else
            echo "⏭️  Skipped — no corpus files"
          fi

      # ── Enriquecimiento semántico (local, $0.00) ──────────────
      - name: "🧠 Enrich docs (keywords + summary)"
        run: |
          pip install -q rake-nltk sumy nltk
          python -c "import nltk; nltk.download('punkt', quiet=True); nltk.download('punkt_tab', quiet=True); nltk.download('stopwords', quiet=True)"
          python -m core.enrich
        env:
          CORPUS_DIR: ${{ github.workspace }}/corpus

      # ── Commit y push ──────────────────────────────────────────
      - name: "\U0001F4E4 Commit & push"
        run: |
          git config user.name  "Knowledge Bot"
          git config user.email "bot@knowledge-pipeline.ai"
          git add corpus/ graphify-out/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "✅ No new changes to commit."
          else
            NEW_FILES=$(git diff --staged --name-only | wc -l)
            TS=$(date -u '+%Y-%m-%d %H:%M UTC')
            git commit -m "knowledge: +${NEW_FILES} files | run ${{ github.run_number }} | ${TS} [skip ci]"
            git push
            echo "✅ Pushed ${NEW_FILES} updated files"
          fi

      # ── Resumen ────────────────────────────────────────────────
      - name: "\U0001F4CA Summary"
        if: always()
        run: |
          echo "========================================"
          echo " KNOWLEDGE PIPELINE — 15 AGENTS"
          echo "========================================"
          for dir in corpus/*/; do
            [ -d "$dir" ] || continue
            count=$(find "$dir" -name "*.md" 2>/dev/null | wc -l)
            printf "  %-25s %5d docs\n" "$(basename "$dir")" "$count"
          done
          echo "────────────────────────────────────────"
          TOTAL=$(find corpus/ -name "*.md" 2>/dev/null | wc -l)
          echo "  TOTAL                     $TOTAL docs"
          echo "  Graph nodes: $(python3 -c "import json,pathlib; g=json.loads(pathlib.Path('graphify-out/graph.json').read_text()); print(len(g.get('nodes',[])))" 2>/dev/null || echo 'N/A')"
          echo "  Run: ${{ github.run_number }} | ${{ github.event_name }}"
          echo "========================================"
