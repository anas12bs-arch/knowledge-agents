name: "\U0001F9E0 Knowledge Pipeline — 24/7"

# ══════════════════════════════════════════════════════════════════
#  ARQUITECTURA SIMPLIFICADA:
#    1. Cada 15min UN solo job corre los 4 agentes secuencialmente
#    2. Cada uno escribe .md al corpus/ del repo
#    3. graphify update . --no-cluster genera el knowledge graph
#    4. El resultado (graphify-out/ + corpus/) se commitea al repo
#    5. Tu Mac hace `git pull` cuando enciende → grafo actualizado
#
#  REPO PÚBLICO = minutos ILIMITADOS en GitHub Actions (gratis)
#  NO NECESITA:  Supabase · API keys · embeddings externos
# ══════════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: "*/15 * * * *"   # cada 15 minutos
  workflow_dispatch:          # también puedes lanzarlo manualmente

permissions:
  contents: write            # necesario para git push

concurrency:
  group: knowledge-pipeline
  cancel-in-progress: true   # si un run anterior sigue corriendo, cancelar

jobs:
  harvest-and-build:
    name: "\U0001F680 Harvest + Build Graph"
    runs-on: ubuntu-latest
    timeout-minutes: 14       # siempre terminar antes del próximo ciclo
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -q httpx graphifyy

      # ── Correr los 4 agentes secuencialmente ────────────────────
      - name: "\U0001F4F0 Agent News (HN + Dev.to + RSS)"
        run: python agents/agent_news.py
        env:
          CORPUS_DIR: ${{ github.workspace }}/corpus

      - name: "\U0001F419 Agent GitHub (trending + releases)"
        run: python agents/agent_github.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CORPUS_DIR: ${{ github.workspace }}/corpus

      - name: "\U0001F393 Agent Skills (roadmap + npm + PyPI + arxiv)"
        run: python agents/agent_skills.py
        env:
          CORPUS_DIR: ${{ github.workspace }}/corpus

      - name: "\U0001F4F1 Agent Social (Twitter + YouTube + Reddit + Podcasts)"
        run: python agents/agent_social.py
        env:
          CORPUS_DIR: ${{ github.workspace }}/corpus

      # ── Debug: verificar corpus ─────────────────────────────────
      - name: "\U0001F4C1 Corpus stats"
        run: |
          echo "📁 Corpus content:"
          TOTAL=$(find corpus/ -name "*.md" 2>/dev/null | wc -l)
          echo "  Total markdown files: $TOTAL"
          for dir in corpus/*/; do
            [ -d "$dir" ] || continue
            count=$(find "$dir" -name "*.md" 2>/dev/null | wc -l)
            echo "  $(basename "$dir"): $count files"
          done
          if [ "$TOTAL" -eq 0 ]; then
            echo "⚠️  No corpus files generated — skipping graph build"
            exit 0
          fi

      # ── Construir knowledge graph ──────────────────────────────
      - name: "\U0001F528 Build knowledge graph (graphify)"
        run: |
          TOTAL=$(find corpus/ -name "*.md" 2>/dev/null | wc -l)
          if [ "$TOTAL" -gt 0 ]; then
            graphify update . --no-cluster
            echo "✅ Graph built"
            if [ -f graphify-out/GRAPH_REPORT.md ]; then
              echo "=== GRAPH REPORT (first 40 lines) ==="
              head -40 graphify-out/GRAPH_REPORT.md
            fi
          else
            echo "⏭️  Skipped — no corpus files"
          fi

      # ── Commit y push ──────────────────────────────────────────
      - name: "\U0001F4E4 Commit & push"
        run: |
          git config user.name  "Knowledge Bot"
          git config user.email "bot@knowledge-pipeline.ai"
          git add corpus/ graphify-out/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "✅ No new changes to commit."
          else
            NEW_FILES=$(git diff --staged --name-only | wc -l)
            TS=$(date -u '+%Y-%m-%d %H:%M UTC')
            git commit -m "knowledge: +${NEW_FILES} files | run ${{ github.run_number }} | ${TS} [skip ci]"
            git push
            echo "✅ Pushed ${NEW_FILES} updated files"
          fi

      # ── Resumen final ──────────────────────────────────────────
      - name: "\U0001F4CA Summary"
        if: always()
        run: |
          echo "========================================"
          echo " KNOWLEDGE PIPELINE SUMMARY"
          echo "========================================"
          TOTAL=$(find corpus/ -name "*.md" 2>/dev/null | wc -l || echo 0)
          echo " Total corpus files : $TOTAL"
          echo " Graph nodes        : $(python3 -c "import json,pathlib; g=json.loads(pathlib.Path('graphify-out/graph.json').read_text()); print(len(g.get('nodes',[])))" 2>/dev/null || echo 'N/A')"
          echo " Run number         : ${{ github.run_number }}"
          echo " Triggered by       : ${{ github.event_name }}"
          echo "========================================"
